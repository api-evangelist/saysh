name: Saysh
description: 'Saysh is a direct-to-consumer athletic footwear and apparel brand founded by Olympic
  champion sprinter Allyson Felix, designing sneakers engineered specifically for women''s biomechanics
  under the banner "Women Deserve Better." Its lineup spans performance running shoes (the Felix Runner
  and Evelyn Runner) and the everyday Saysh One, plus apparel, accessories, and the Saysh+ Run Club
  membership. The saysh.com storefront runs on Shopify, so customer-facing commerce is served through
  the Shopify platform rather than a first-party Saysh developer API; no public Saysh API program,
  OpenAPI, SDKs, or developer portal were found. Backed by Redpoint Ventures.'
